aid: code-metal
name: Code Metal
description: >-
  Code Metal is a Boston-based AI company building a verifiable code translation
  and optimization platform for mission-critical, edge, and regulated industries
  including defense, automotive, semiconductor, robotics, and aerospace. The
  platform ingests high-level research and prototype code (Python, MATLAB, Julia)
  and produces optimized, edge-ready low-level code across C/C++, Rust, VHDL,
  Verilog, CUDA, HIP, and ONNX, using a divide-and-conquer pipeline that
  instruments and tests, translates and verifies functional equivalence, then
  optimizes and benchmarks against target CPU/GPU/FPGA runtimes. Code Metal was
  surfaced as a portfolio company of Accel and added to the API Evangelist
  network. As of this enrichment pass the company publishes no public API,
  developer documentation, or specification surface; this profile carries
  verified company identity plus a probed domain-security posture.
